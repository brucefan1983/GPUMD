name: CUDA CI on Windows

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v2      
      
    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1.13.0
      with:
        arch: x64
        vsversion: "2022"
      
    - name: Install CUDA      
      run: |
        choco install cuda --version=12.9.1.576
        
    - name: Build project
      shell: cmd
      run: |
        set PATH=%PATH%;C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9\bin
        nvcc --version
        make -C src gpumd nep

    - name: Build replica executable
      shell: cmd
      run: |
        set PATH=%PATH%;C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9\bin
        make -C src gpumd_replica -j2
        if errorlevel 1 exit /b 1
        if not exist src\gpumd_replica.exe exit /b 1
